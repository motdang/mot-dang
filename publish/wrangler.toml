# The site Worker. Separate from worker/ (mot-dang-claims) on purpose: that one
# holds owner claims in KV and must not be redeployed every time a page changes.
#
# FIRST TIME
#   cd publish
#   npx wrangler r2 bucket create mot-dang-site
#   npx wrangler deploy
#   # then in the dashboard: Workers > mot-dang-site > Settings > Domains
#   # add motdang.net and www.motdang.net (the zone is already on Cloudflare,
#   # which is what makes a custom domain possible here at all)
#
# EVERY DEPLOY AFTER THAT is just content — python3 publish/deploy.py — and does
# not touch this Worker at all. The Worker only changes when routing does.
#
# LOCAL TEST, no account needed:
#   npx wrangler dev --local
#   # --local gives a simulated R2 on disk; seed it with
#   #   npx wrangler r2 object put mot-dang-site/index.html --file=../docs/index.html --local

name = "mot-dang-site"
main = "worker.js"
compatibility_date = "2026-07-01"

# Binding name must stay SITE — worker.js reads env.SITE. Same gotcha the
# claims worker documents: wrangler's suggested snippet names the binding after
# the resource, which compiles and then 500s on an undefined binding.
[[r2_buckets]]
binding = "SITE"
bucket_name = "mot-dang-site"

# The edge count (Nan's decision 2026-09-05, arrivals note A1). One row per
# request, written from inside this Worker — see the block at the foot of
# worker.js for what a row holds and what it deliberately leaves out.
#
# The dataset is traffic-eye's, on purpose: that project already collects the
# same eight blobs for the other sites and already has a dashboard over them.
# A route could not be used here — motdang.net/* belongs to this Worker — so
# the classifier is vendored into publish/classify.js instead.
#
# The dataset is created on first write; nothing to set up beyond having
# Analytics Engine enabled on the account, which it is (traffic_eye exists).
#
# Binding name must stay TRAFFIC — worker.js reads env.TRAFFIC. If it is
# missing the Worker still serves every page and simply records nothing.
[[analytics_engine_datasets]]
binding = "TRAFFIC"
dataset = "traffic_eye"

# The fleet search index (fleetsearch/README.md): every page of every site on
# the roster, in FTS5. Filled by `python3 fleetsearch/load.py --remote` — a
# content step, like deploy.py; the Worker only changes when the query or the
# page does. Binding name must stay SEARCH — fleetsearch.js reads env.SEARCH.
# Without it /find answers 503 and every other path serves as before.
# Sign in with LINE and saved things across devices (publish/accounts.js,
# migrations/0006_accounts.sql). Without the LINE_LOGIN_ID / LINE_LOGIN_SECRET
# secrets, /auth/line answers "not switched on yet" and nothing else changes.
[[d1_databases]]
binding = "ACCOUNTS"
database_name = "motdang-accounts"
database_id = "52dcfb91-1a2c-4621-9b1e-3bb018ee9f3a"

[[d1_databases]]
binding = "SEARCH"
database_name = "motdang-search"
database_id = "abec2f32-1958-413f-b05c-02c40af65f1d"

# The meaning half of /find (publish/findmeaning.js): the query embedded with
# bge-m3 on Workers AI, matched against every page in the Vectorize index
# motdang-find (filled by `python3 fleetsearch/embed.py`). Without either
# binding /find is the word search alone.
[ai]
binding = "AI"

[[vectorize]]
binding = "FIND_VEC"
index_name = "motdang-find"

# The live site. Declared here rather than clicked in the dashboard so the
# domain binding is recorded in the repo — if this Worker ever has to be
# rebuilt from scratch, the hostname comes back with it.
#
# A hostname belongs to exactly one Cloudflare service, so these were detached
# from the `motdang` Pages project first (2026-08-12). Pages had been serving
# the site from a GitHub-connected build that stopped updating when the account
# was suspended.
# ROUTES, not custom_domain. A custom domain asks Cloudflare to create and own
# the DNS record, and it refuses when a record already exists — which it does
# here, left behind by the Pages setup. A route instead intercepts requests to
# a hostname that is ALREADY proxied through Cloudflare, which those records
# are. Same result, no DNS surgery, and it works with records this account's
# deploy token cannot edit.
# The mailing list (publish/subscribe.js). A D1 database of ITS OWN — never the
# search index above (a reload of that must not touch a person's address) and
# never the SITE bucket (that is the public web). Binding name must stay
# SUBSCRIBERS — subscribe.js reads env.SUBSCRIBERS. Until it is bound, /subscribe
# answers "not ready" and every other path serves as before.
#
# NOT created or migrated by a content deploy. Nan does it once:
#   npx wrangler d1 create motdang-subscribers        # paste the id below
#   npx wrangler d1 execute motdang-subscribers --file=migrations/0001_subscribers.sql --remote
[[d1_databases]]
binding = "SUBSCRIBERS"
database_name = "motdang-subscribers"
database_id = "15b25cdc-8cc1-4c85-9c2f-96d7c697dea1"

# THE SEND GATE. Double opt-in confirmation mail is OFF until this reads exactly
# "true". Off (and off when unset): subscribe.js composes the message and logs
# it, and never calls Resend. No marketing mail is sent from here at all. Flip to
# "true" ONLY after RESEND_KEY is set and you have okayed the consent copy.
[vars]
MAILING_LIST_LIVE = "true"
# THE WEEKLY ISSUE (newsletter.js). Off unless exactly "true": an issue POSTed
# to /newsletter/send goes only to NEWSLETTER_TEST, never to the confirmed list.
# The POST is checked against the NEWSLETTER_TOKEN secret (token get NEWSLETTER_TOKEN).
NEWSLETTER_LIVE = "false"
NEWSLETTER_TEST = "events@motdang.net"
# The same issue on LINE to readers who said yes, signed in with LINE (me.js;
# Nan 2026-10-20, her pick: the week on LINE each Monday and a Gold month).
# Anything but "true" sends it only to the IDs in the NEWSLETTER_LINE_TEST secret.
NEWSLETTER_LINE_LIVE = "true"
# WHICH ROBOTS PAY (crawlpay.js, Nan 2026-10-04 "let's run a test"). "on" sends
# training crawlers a 402 on one page in ten; anything else and they are served
# as before. The two prices are hers to set; empty = no 402 even when "on".
# On 2026-10-04 at her word: "0.001 and 0.05 as the test. kinda bracket it." 14 days.
CRAWLPAY_ASK = "on"
CRAWLPAY_PRICE_LO = "USD 0.001"
CRAWLPAY_PRICE_HI = "USD 0.05"
# The ask stops by itself after this moment (14 days from her go); listening goes on.
CRAWLPAY_UNTIL = "2026-10-18T03:45:00Z"
# The listing-agent gate (lister.js). "auto" (Nan, 2026-09-27): a confirmed
# applicant who passes the sanity check is invited; one who fails waits with
# the reasons on the row, and listing-sheet/digest.py mails Nan both once a
# day. "operator": every applicant waits for her INVITE tap, one mail each.
LISTER_INVITE = "auto"

# THE SEND PATH: Resend, sending as nan@motdang.net — the same service beer-mail
# uses, and motdang.net is already a verified domain there, so it can reach an
# arbitrary subscriber's inbox (a destination-pinned CF binding cannot). The API
# key is a SECRET, never in this file or in code:
#   wrangler secret put RESEND_KEY
# Point it at the account's motdang.net Resend key. Nothing sends until the key
# is set AND MAILING_LIST_LIVE is flipped to "true".

# The listing-agent gate signs its cookie and the add form's bearer with a
# SECRET that the claims Worker (worker/) holds too, set the same on both:
#   wrangler secret put LISTER_SECRET
#
# Mail to Nan from lister.js (a confirmed applicant, with INVITE / DECLINE
# links). Pinned to her address, the same as the claims Worker's MAIL, so this
# binding reaches her inbox and no other; that is why it is not behind
# MAILING_LIST_LIVE.
[[send_email]]
name = "MAIL"
destination_address = "530kings@proton.me"

[[routes]]
pattern = "motdang.net/*"
zone_name = "motdang.net"

[[routes]]
pattern = "www.motdang.net/*"
zone_name = "motdang.net"

# A reader's position, shared for an hour (live.js, Nan 2026-10-01). Its own
# database: a row lives for the hour and goes. Binding name must stay LIVE —
# live.js reads env.LIVE; without it /api/live answers 503.
#   npx wrangler d1 create motdang-live
#   npx wrangler d1 execute motdang-live --remote --file=migrations/0004_live.sql
[[d1_databases]]
binding = "LIVE"
database_name = "motdang-live"
database_id = "6afa7e56-c839-4eef-9688-0ace550018da"

# More for a reader signed in with LINE (me.js, Nan 2026-10-20): the Mot Dang
# LINE account's Worker (motdang-line, src/entry.js class Site) sends the pushes
# and keeps home alerts and reminders; motdang-pages' database holds the Gold
# month code a reader gets for saying yes to the week on LINE.
[[services]]
binding = "LINEBOT"
service = "motdang-line"
entrypoint = "Site"

[[d1_databases]]
binding = "PAGES_DB"
database_name = "motdang-pages"
database_id = "aa48eb0d-bfa8-449e-9041-a2de9906a452"
